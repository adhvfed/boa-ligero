[package]
name = "boa_benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
boa_engine = { workspace = true, features = ["intl_bundled"] }
boa_runtime.workspace = true

[features]
# Enable the experimental Cranelift tier for the optional JIT benchmark mode.
jit = ["boa_engine/jit"]

# Passthrough for the off-by-default arith-opportunity instrumentation in
# boa_engine. Enable with `--features arith-instrument` on this crate.
arith-instrument = ["boa_engine/arith-instrument"]

[dev-dependencies]
criterion.workspace = true
walkdir = "2"

[target.x86_64-unknown-linux-gnu.dev-dependencies]
jemallocator.workspace = true

[[bench]]
name = "scripts"
harness = false

[[bin]]
name = "bench-compare-runner"
path = "src/bin/bench-compare-runner.rs"
